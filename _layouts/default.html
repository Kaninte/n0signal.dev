<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Disable Crawlers -->
  <meta name="robots" content="index, follow, noai, noimageai, noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>
    {% if page.title %}{{ page.title }} // {% endif %}{{ site.title | default: "n0signal" }}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="/assets/style.css">
  {% if page.home_css %}<link rel="stylesheet" href="/assets/home.css">{% endif %}
</head>
<body>
  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script>
    // Mobile nav toggle
    const btn = document.getElementById('navToggle');
    const nav = document.getElementById('nav');
    btn?.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    // Auto-update year
    const y = document.getElementById('y');
    if (y) y.textContent = new Date().getFullYear();
  </script>
  <script>
    // Copy code block
  document.querySelectorAll('.prose pre').forEach((block) => {
    const code = block.querySelector('code');

    if (!code) return;

    const button = document.createElement('button');
    button.className = 'code-copy';
    button.type = 'button';
    button.textContent = 'Copy';
    button.setAttribute('aria-label', 'Copy code to clipboard');

    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(code.innerText);

        button.textContent = 'Copied';
        button.classList.add('copied');

        window.setTimeout(() => {
          button.textContent = 'Copy';
          button.classList.remove('copied');
        }, 1600);
      } catch (error) {
        button.textContent = 'Failed';

        window.setTimeout(() => {
          button.textContent = 'Copy';
        }, 1600);
      }
    });

    block.appendChild(button);
  });
</script>
  
</body>
</html>
