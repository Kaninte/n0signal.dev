<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Disable Crawlers -->
  <meta name="robots" content="index, follow, noai, noimageai, noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>
    {% if page.title %}{{ page.title }} // {% endif %}{{ site.title | default: "n0signal" }}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="/assets/style.css">
  {% if page.home_css %}<link rel="stylesheet" href="/assets/home.css">{% endif %}
</head>
<body>
  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script>
    // Mobile nav toggle
    const btn = document.getElementById('navToggle');
    const nav = document.getElementById('nav');
    btn?.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    // Auto-update year
    const y = document.getElementById('y');
    if (y) y.textContent = new Date().getFullYear();
  </script>

  <script>
  // Copy code blocks
  document.querySelectorAll('.prose pre').forEach((block) => {
    const code = block.querySelector('code');

    if (!code) return;

    const copyIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="11" height="11" rx="1"></rect>
        <path d="M16 8V5H5v11h3"></path>
      </svg>
    `;

    const successIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    `;

    const button = document.createElement('button');

    button.className = 'code-copy';
    button.type = 'button';
    button.innerHTML = copyIcon;
    button.setAttribute('aria-label', 'Copy code to clipboard');
    button.setAttribute('title', 'Copy');

    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(code.innerText);

        button.innerHTML = successIcon;
        button.classList.add('copied');
        button.setAttribute('aria-label', 'Copied');
        button.setAttribute('title', 'Copied');

        window.setTimeout(() => {
          button.innerHTML = copyIcon;
          button.classList.remove('copied');
          button.setAttribute('aria-label', 'Copy code to clipboard');
          button.setAttribute('title', 'Copy');
        }, 1600);
      } catch (error) {
        button.classList.add('failed');
        button.setAttribute('aria-label', 'Copy failed');
        button.setAttribute('title', 'Copy failed');

        window.setTimeout(() => {
          button.classList.remove('failed');
          button.setAttribute('aria-label', 'Copy code to clipboard');
          button.setAttribute('title', 'Copy');
        }, 1600);
      }
    });

    block.appendChild(button);
  });
</script>
  
</body>
</html>
