---
layout: default
---

<section class="hero blog-hero about-hero">
  <div class="wrap">
    <div class="hero-inner">
      <div>
        <div class="kicker grey">About</div>
        <h1 class="title">{{ page.title }}</h1>

        {% if page.description %}
          <p class="lead">{{ page.description }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>

<main class="wrap about-page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <div id="about-record-source" class="about-record-source">
    {{ content }}
  </div>
</main>

{% if page.script %}
  <script
    src="{{ '/assets/js/about/' | append: page.script | append: '.js' | relative_url }}"
    defer>
  </script>
{% endif %}
