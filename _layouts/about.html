---
layout: default
---

<section class="hero blog-hero about-hero">
  <div class="wrap">
    <div class="hero-inner">
      <div>
        <div class="kicker grey">Profile / Records</div>
        <h1 class="title">{{ page.title }}</h1>
        {% if page.description %}
          <p class="lead">{{ page.description }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>

<main class="wrap about-record-page">
  <div id="about-record-source" class="about-record-source">
    {{ content }}
  </div>
</main>

<script>
(() => {
  const source = document.getElementById("about-record-source");
  if (!source) return;

  source.classList.add("is-processing");

  const textLines = (node) =>
    (node.textContent || "")
      .split(/\n+/)
      .map((line) => line.trim())
      .filter(Boolean);

  const parseMeta = (nodes) => {
    const meta = {};
    for (const node of nodes) {
      for (const line of textLines(node)) {
        const match = line.match(/^([A-Za-z][A-Za-z &]+):\s*(.*)$/);
        if (!match) continue;
        meta[match[1].trim()] = match[2].trim();
      }
    }
    return meta;
  };

  const splitSubjectGrade = (li) => {
    const checkbox = li.querySelector('input[type="checkbox"]');
    const raw = (li.textContent || "").trim();
    const match = raw.match(/^(.*?)\s+-\s+(HD|DN|CR|PS|FL)$/i);

    const name = match ? match[1].trim() : raw;
    const grade = match ? match[2].toUpperCase() : "";

    li.childNodes.forEach((node) => {
      if (node !== checkbox) node.remove();
    });

    const nameSpan = document.createElement("span");
    nameSpan.className = "subject-name";
    nameSpan.textContent = name;
    li.appendChild(nameSpan);

    if (grade) {
      const gradeSpan = document.createElement("span");
      gradeSpan.className = "subject-grade";
      gradeSpan.dataset.grade = grade;
      gradeSpan.textContent = grade;
      li.appendChild(gradeSpan);
    }
  };

  const children = Array.from(source.children);
  const fragment = document.createDocumentFragment();

  let section = null;
  let record = null;
  let recordBody = null;
  let stage = null;

  const makeSection = (heading) => {
    const el = document.createElement("section");
    el.className = "about-record-section";

    const head = document.createElement("div");
    head.className = "about-record-section-header";
    heading.className = "";
    head.appendChild(heading);
    el.appendChild(head);

    fragment.appendChild(el);
    return el;
  };

  const finishRecordMeta = (recordEl, bodyEl) => {
    if (!recordEl || !bodyEl) return;

    const metaNodes = Array.from(bodyEl.children).filter(
      (el) => el.tagName === "P" && /(?:Institution|Status|Type|Completed):/.test(el.textContent || "")
    );

    const meta = parseMeta(metaNodes);
    metaNodes.forEach((node) => node.remove());

    if (meta.Type) recordEl.dataset.type = meta.Type;

    const status = recordEl.querySelector(".about-record-status");
    if (status) {
      if (meta.Status) status.textContent = meta.Status;
      else status.remove();
    }

    const fields = [
      ["Institution", meta.Institution],
      ["Type", meta.Type],
      ["Completed", meta.Completed],
    ];

    const dl = document.createElement("dl");
    dl.className = "about-record-meta";

    for (const [label, value] of fields) {
      if (label === "Completed" && !value) continue;

      const wrapper = document.createElement("div");
      wrapper.className = "about-record-meta-item";

      const dt = document.createElement("dt");
      dt.textContent = label;

      const dd = document.createElement("dd");
      dd.textContent = value || "—";
      if (!value) dd.classList.add("is-empty");

      wrapper.append(dt, dd);
      dl.appendChild(wrapper);
    }

    if (dl.children.length) {
      bodyEl.insertBefore(dl, bodyEl.firstChild);
    }
  };

  const startRecord = (heading) => {
    if (!section) return null;

    finishRecordMeta(record, recordBody);

    const el = document.createElement("article");
    el.className = "about-record";

    const head = document.createElement("div");
    head.className = "about-record-head";

    heading.className = "about-record-title";

    const status = document.createElement("span");
    status.className = "about-record-status";
    status.textContent = "";

    head.append(heading, status);

    const body = document.createElement("div");
    body.className = "about-record-body";

    el.append(head, body);
    section.appendChild(el);

    record = el;
    recordBody = body;
    stage = null;
    return body;
  };

  const startStage = (heading) => {
    if (!recordBody) return null;

    const el = document.createElement("section");
    el.className = "about-study-stage";

    const head = document.createElement("div");
    head.className = "about-study-stage-head";

    heading.className = "about-study-stage-title";

    const date = document.createElement("span");
    date.className = "about-study-stage-date";

    head.append(heading, date);
    el.appendChild(head);
    recordBody.appendChild(el);

    stage = el;
    return el;
  };

  for (const node of children) {
    const tag = node.tagName;

    if (tag === "H2") {
      finishRecordMeta(record, recordBody);
      record = null;
      recordBody = null;
      stage = null;
      section = makeSection(node);
      continue;
    }

    if (tag === "H3") {
      startRecord(node);
      continue;
    }

    if (tag === "H4") {
      startStage(node);
      continue;
    }

    if (stage) {
      if (tag === "P" && /^Completed:/.test((node.textContent || "").trim())) {
        const value = (node.textContent || "").replace(/^Completed:\s*/, "").trim();
        const date = stage.querySelector(".about-study-stage-date");
        if (date) date.textContent = value ? `Completed ${value}` : "";
        continue;
      }

      if (tag === "UL") {
        node.querySelectorAll(":scope > li").forEach(splitSubjectGrade);
      }

      stage.appendChild(node);
      continue;
    }

    if (recordBody) {
      recordBody.appendChild(node);
      continue;
    }

    if (section) {
      section.appendChild(node);
      continue;
    }

    fragment.appendChild(node);
  }

  finishRecordMeta(record, recordBody);

  source.replaceChildren(fragment);
  source.classList.remove("is-processing");
})();
</script>
