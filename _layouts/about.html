---
layout: default
---

<section class="hero blog-hero about-hero">
  <div class="wrap">
    <div class="hero-inner">
      <div>
        <div class="kicker grey">About</div>
        <h1 class="title">{{ page.title }}</h1>

        {% if page.description %}
          <p class="lead">{{ page.description }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>

<main class="wrap about-page {{ page.page_class }}">
  {{ content }}
</main>
