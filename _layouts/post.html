---
layout: default
---
<header class="post-hero {{ page.color | default: 'purp' }}">
  <div class="wrap">
    {% if page.kicker %}
      <div class="kicker">{{ page.kicker }}</div>
    {% endif %}

    <h1 class="title">{{ page.title }}</h1>

    <p class="post-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
    </p>

    {% if page.lead %}
      <p class="lead">{{ page.lead }}</p>
    {% endif %}
  </div>
</header>
