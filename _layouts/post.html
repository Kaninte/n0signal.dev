---
layout: default
---
<section class="hero post-hero {{ page.color | default: 'purp' }}">
  <div class="wrap hero-inner">
    <div>
      {% if page.kicker %}
        <div class="kicker">{{ page.kicker }}</div>
      {% endif %}

      <h1 class="title">{{ page.title }}</h1>

      <p class="post-date">
        <small>{{ page.date | date: "%Y-%m-%d" }}</small>
      </p>

      {% if page.lead %}
        <p class="lead">{{ page.lead }}</p>
      {% endif %}
    </div>
  </div>
</section>

<section class="wrap prose">
  {{ content }}
</section>
